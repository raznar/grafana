name: run-dashboard-search-e2e

on:
  workflow_run:
    workflows:
      - trigger-dashboard-search-e2e
    types:
      - completed
  workflow_dispatch:

env:
  ARCH: linux-amd64

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      ini_files: ${{ steps.get_files.outputs.ini_files }}

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin Go version to mod file
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go version
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
      - name: Install Playwright browsers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Cache Grafana Build and Dependencies
        id: cache-grafana
        uses: actions/cache@v4
        with:
          path: |
            bin/
            scripts/grafana-server/
            tools/
            public/
            conf/
            e2e-playwright/test-plugins/
            devenv/
          key: ${{ runner.os }}-grafana-${{ hashFiles('go.mod', 'yarn.lock', 'Makefile', 'pkg/storage/**/*.go', 'public/app/features/search/**/*.ts', 'public/app/features/search/**/*.tsx') }}
      # only rebuild grafana if search files have changed ( or dependencies )
      - name: Build Grafana (Runs Only If Not Cached)
        if: steps.cache-grafana.outputs.cache-hit != 'true'
        run: make build

      - name: Get list of .ini files
        id: get_files
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          INI_FILES="$(find "$WORKSPACE"/e2e-playwright/dashboards-search-suite/ -type f -name '*.ini' | jq -R -s -c 'split("\n")[:-1]')"
          echo "ini_files=$INI_FILES" >> "$GITHUB_OUTPUT"
        shell: bash

  run_tests:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        ini_file: ${{ fromJson(needs.setup.outputs.ini_files) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore Cached Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}

      - name: Restore Cached Grafana Build and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            bin/
            scripts/grafana-server/
            tools/
            public/
            conf/
            e2e-playwright/test-plugins/
            devenv/
          key: ${{ runner.os }}-grafana-${{ hashFiles('go.mod', 'yarn.lock', 'Makefile', 'pkg/storage/**/*.go', 'public/app/features/search/**/*.ts', 'public/app/features/search/**/*.tsx') }}
      - name: Set the step name
        id: set_file_name
        env:
          INI_NAME: ${{ matrix.ini_file }}
        run: |
          FILE_NAME="$(basename "$INI_NAME" .ini)"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Run tests for ${{ steps.set_file_name.outputs.FILE_NAME }}
        env:
          INI_NAME: ${{ matrix.ini_file }}
          WORKSPACE: ${{ github.workspace }}
          NODE_OPTIONS: '-C @grafana-app/source'
        run: |
          cp -rf "$INI_NAME" "$WORKSPACE"/scripts/grafana-server/custom.ini
          GRAFANA_URL=http://localhost:3001 ./scripts/grafana-server/start-server > "$WORKSPACE"/scripts/grafana-server/server.log 2>&1 &
          ./scripts/grafana-server/wait-for-grafana
          yarn playwright test e2e-playwright/dashboards-search-suite/dashboards-search.spec.ts --grep @dashboards-search || echo "Test failed but marking as success since unified search is behind a feature flag and should not block PRs"
